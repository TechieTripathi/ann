name: Deploy Slidev to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build Lecture 1 (ANN)
        run: npm run build -- --out dist/lecture-01 --base /${{ github.event.repository.name }}/lecture-01/ --router-mode hash
      - name: Build Lecture 2 (Backpropagation)
        run: npm run build:02 -- --out dist/lecture-02 --base /${{ github.event.repository.name }}/lecture-02/ --router-mode hash
      - name: Build Lecture 3 (PyTorch)
        run: npm run build:03 -- --out dist/lecture-03 --base /${{ github.event.repository.name }}/lecture-03/ --router-mode hash
      - name: Add course index
        run: cp landing/index.html dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
